<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Discord Bot Dashboard</title>
  <style>
    body { background: #0d1117; color: #d1d5db; font-family: Inter, sans-serif; margin: 0; }
    .wrap { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
    .card { background:#161b22; border:1px solid #30363d; border-radius:12px; padding:1rem; margin-bottom:1rem; }
    table { width:100%; border-collapse: collapse; }
    th,td { padding: .5rem; border-bottom: 1px solid #30363d; text-align:left; }
    .badge { border-radius:999px; padding: .2rem .6rem; font-size: .8rem; }
    .on { background:#1f6feb33; color:#58a6ff; }
    .off { background:#f8514933; color:#ff7b72; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>Bot Overview</h1>
  <div class="card">
    <h2>Plugins</h2>
    <table id="plugins"><thead><tr><th>Name</th><th>Status</th></tr></thead><tbody></tbody></table>
  </div>
</div>
<script>
async function loadPlugins() {
  const resp = await fetch('/api/plugins');
  const items = await resp.json();
  const body = document.querySelector('#plugins tbody');
  body.innerHTML = items.map(p => `<tr><td>${p.name}</td><td><span class="badge ${p.enabled ? 'on' : 'off'}">${p.enabled ? 'enabled' : 'disabled'}</span></td></tr>`).join('');
}
loadPlugins();
</script>
</body>
</html>
